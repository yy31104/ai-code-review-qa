name: Eval Harness

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub schedules run in UTC. 01:17 UTC avoids the top-of-hour queue.
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run golden-case evals
        run: python evals/run_local.py --out reports/evals/results.json

      - name: Render eval report
        run: |
          python evals/render_report.py \
            --in reports/evals/results.json \
            --md reports/evals/summary.md \
            --html reports/evals/summary.html

      - name: Upload eval artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: eval-report
          path: |
            reports/evals/results.json
            reports/evals/summary.md
            reports/evals/summary.html
          if-no-files-found: error

      - name: Publish eval summary
        run: cat reports/evals/summary.md >> "$GITHUB_STEP_SUMMARY"
