name: PR Comment Payload Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pr-comment-payload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build dry-run review payload
        env:
          AI_REVIEW_MODE: demo
        run: |
          python backend/app/main.py \
            --repo . \
            --base HEAD~1 \
            --head HEAD \
            --output backend/reports/review_report.html \
            --emit-github-review reports/github/review.json \
            --head-sha "${{ github.sha }}"

      - name: Upload dry-run review payload
        uses: actions/upload-artifact@v6
        with:
          name: github-review-payload
          path: reports/github/review.json
          if-no-files-found: error
