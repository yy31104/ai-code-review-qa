name: PR Comment Payload Dry Run

on:
  workflow_dispatch:
    inputs:
      post_summary:
        description: "Whether to actually upsert the PR summary comment."
        type: boolean
        default: false
      pull_number:
        description: "PR number to comment on when post_summary is true."
        type: string
        required: false
      head_sha:
        description: "Optional commit SHA to include in dry-run payload metadata."
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build dry-run review artifacts
        env:
          AI_REVIEW_MODE: static
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          HEAD_SHA="$INPUT_HEAD_SHA"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$GITHUB_SHA_VALUE"
          fi

          python backend/app/main.py \
            --repo . \
            --base HEAD~1 \
            --head HEAD \
            --output backend/reports/review_report.html \
            --emit-github-review reports/github/review.json \
            --emit-summary-comment reports/github/summary-comment.json \
            --head-sha "$HEAD_SHA"

      - name: Upload dry-run review artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: github-review-artifacts
          path: |
            backend/reports/review_report.html
            reports/github/review.json
            reports/github/summary-comment.json
          if-no-files-found: error

  post:
    needs: build
    if: ${{ inputs.post_summary == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # inputs.pull_number is free text typed into the dispatch form. It reaches
      # the shell only as the PULL_NUMBER environment variable, never as text
      # spliced into the script, and must be a positive integer before any API
      # call uses it.
      - name: Validate pull number
        env:
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          case "$PULL_NUMBER" in
            "")
              echo "pull_number is required when post_summary is true." >&2
              exit 1
              ;;
            0* | *[!0-9]*)
              echo "pull_number must be a positive integer without leading zeros." >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Download dry-run review artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: github-review-artifacts
          path: .

      - name: List existing PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          mkdir -p reports/github
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PULL_NUMBER}/comments" \
            --paginate > reports/github/existing-comments.json

      - name: Decide summary comment action
        id: decide
        run: |
          decision="$(python backend/app/github_comment_upsert.py --comments reports/github/existing-comments.json)"
          echo "$decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Create summary comment
        if: ${{ steps.decide.outputs.decision == 'create' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PULL_NUMBER}/comments" \
            --input reports/github/summary-comment.json

      - name: Patch summary comment
        if: ${{ startsWith(steps.decide.outputs.decision, 'patch ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.decide.outputs.decision }}
        run: |
          COMMENT_ID="${DECISION#patch }"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            --input reports/github/summary-comment.json
